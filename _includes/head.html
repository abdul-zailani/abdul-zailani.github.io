<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  {%- include json-ld.html -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="preload" href="{{ '/assets/css/tailwind.min.css' | relative_url }}" as="style">
  <link rel="stylesheet" href="{{ '/assets/css/tailwind.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/pagefind/pagefind-ui.css' | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;family=Caveat:wght@400;600;700&amp;display=swap">
  <style>
    :root {
      --excalidraw-skyblue: #0284C7;
      --excalidraw-emerald: #16A34A;
      --excalidraw-coral: #E11D48;
      --excalidraw-amber: #D97706;
    }
    .mermaid-fallback {
      font-family: "Caveat", "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    }
  </style>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('reader-theme');
        if (theme) document.documentElement.setAttribute('data-reading-theme', theme);
        var size = localStorage.getItem('reader-font-size');
        if (size) document.documentElement.style.setProperty('--reader-font-size', size);
        var family = localStorage.getItem('reader-font-family');
        if (family) document.documentElement.style.setProperty('--reader-font-family', family);
      } catch (e) {}
    })();
  </script>
  {%- feed_meta -%}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
  {%- if site.goatcounter_code and site.goatcounter_code != "" -%}
  <script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {%- endif -%}
</head>
