name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Optimize Images to WebP
        run: npm run optimize:images

      - name: Optimize Post Content & Sync Reading Time
        run: npm run optimize:posts

      - name: Generate Open Graph Images & LLMs.txt
        run: npm run build:seo

      - name: Lint & Sanitize Content
        run: npm run lint:content

      - name: Build Jekyll Site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Generate Pagefind Search Index
        run: npm run build:search

      - name: Merge & Finalize XML Sitemap
        run: npm run merge:sitemap

      - name: Minify Final HTML
        run: npm run minify:html

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          git init -b gh-pages
          git -c credential.helper= config user.name "github-actions[bot]"
          git -c credential.helper= config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA} [skip ci]" || echo "No changes to commit"
          git -c credential.helper= push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
