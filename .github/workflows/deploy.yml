name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Optimize Images to WebP
        run: npm run optimize:images

      - name: Optimize Post Content & Sync Reading Time
        run: npm run optimize:posts

      - name: Generate Open Graph Images & LLMs.txt
        run: npm run build:seo

      - name: Lint & Sanitize Content
        run: npm run lint:content

      - name: Build Jekyll Site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Generate Pagefind Search Index
        run: npm run build:search

      - name: Merge & Finalize XML Sitemap
        run: npm run merge:sitemap

      - name: Minify Final HTML
        run: npm run minify:html

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, macOS, ARM64]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
