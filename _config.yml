title: Abdul Aziz Zailani
description: Catatan & Opini seputar SRE, DevOps, dan Otomasi Infrastruktur.
url: "https://abdul-zailani.github.io"
theme: minima
future: true
# Konfigurasi sosial media bawaan Minima (opsional, akan tampil di footer)
twitter_username: aazizzailani
github_username: abdul-zailani

# Plugins Jekyll
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Privacy-friendly analytics (GoatCounter code, e.g. "abdul-zailani")
goatcounter_code: ""

# Konfigurasi agar folder blog di-scan oleh jekyll sebagai posts
permalink: /:year/:month/:day/:title/

# Jekyll ignores files/directories starting with '_' by default.
# We need to include '_next' so Next.js static export assets (e.g. for projects/plafon) are processed and copied.
include:
  - _next
  - projects

# Explicitly control navigation items in the header
header_pages:
  - projects/index.html
  - blog/index.html

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
